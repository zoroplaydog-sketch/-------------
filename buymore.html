    <style>
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            text-align: left;
        }
        .cart-item img {
            width: 80px;
            height: auto;
            border-radius: 6px;
            margin-right: 15px;
            margin-bottom: 0 !important;
        }
        .cart-item-info {
            flex-grow: 1;
        }
        .cart-item-title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        .cart-item-price {
            font-size: 15px;
            color: #ff416c;
            font-weight: bold;
            margin-top: 5px;
        }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .qty-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            color: #333;
        }
        .qty-btn:hover {
            background: #eee;
        }
        .qty-value {
            min-width: 24px;
            text-align: center;
            font-weight: bold;
        }
        .cart-item-remove {
            background: none;
            border: none;
            color: #999;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
            margin-left: 10px;
        }
        .cart-item-remove:hover {
            color: #ff416c;
        }

        .total-price-box {
            font-size: 22px;
            font-weight: bold;
            margin: 25px 0;
            padding-top: 15px;
            border-top: 2px dashed #ff416c;
            color: #222;
        }
        .clear-cart-btn {
            background: none;
            border: none;
            color: #999;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
            margin-top: 15px;
        }
        .clear-cart-btn:hover {
            color: #ff416c;
        }

        .checkout-form-wrap {
            margin: 30px 0 20px 0;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .checkout-form-columns {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }
        .checkout-form-col {
            flex: 1 1 260px;
            min-width: 260px;
        }
        .form-section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            background: #f5f5f5;
            padding: 10px 14px;
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        .form-group .hint {
            display: block;
            font-size: 12px;
            font-weight: normal;
            color: #999;
            margin-top: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            font-family: sans-serif;
            box-sizing: border-box;
            transition: border-color 0.3s;
            background: #fff;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1abc9c;
            outline: none;
        }
        .form-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 14px;
            color: #333;
            text-align: left;
            margin-top: 10px;
        }
        .form-checkbox input {
            margin-top: 3px;
            width: auto;
        }

        .submit-order-btn {
            display: block;
            width: 100%;
            max-width: 340px;
            margin: 30px auto 0 auto;
            padding: 16px 20px;
            background: #4a1f1f;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-order-btn:hover {
            background: #6b2b2b;
        }
        .submit-order-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .continue-shopping-btn {
            display: block;
            width: 100%;
            max-width: 340px;
            margin: 15px auto 0 auto;
            padding: 14px 20px;
            background: #fff;
            color: #4a1f1f;
            border: 2px solid #4a1f1f;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }
        .continue-shopping-btn:hover {
            background: #4a1f1f;
            color: #fff;
        }

        @media (max-width: 600px) {
            .checkout-form-columns {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>

    <header>
        <div class="main" style="padding: 20px; font-family: sans-serif;">
            <a href="index.html">← На головну</a>
        </div>
    </header>

    <main>
        <div class="checkout-container">
            <h2>Ваше замовлення:</h2>

            <div id="product-details" class="checkout-product">
                <p>Завантаження кошика...</p>
            </div>

            <div id="total-price" class="total-price-box">
                Загальна сума: 0 грн
            </div>

            <div class="checkout-form-wrap">
                <div class="checkout-form-columns">

                    <div class="checkout-form-col">
                        <div class="form-section-title">Ваші контакти</div>

                        <div class="form-group">
                            <label for="customer-name">ПІБ *</label>
                            <input type="text" id="customer-name" placeholder="Прізвище Ім'я По батькові" required>
                        </div>

                        <div class="form-group">
                            <label for="customer-email">Ваш e-mail</label>
                            <input type="email" id="customer-email" placeholder="example@mail.com">
                            <span class="hint">Вкажіть, якщо ви хочете стати зареєстрованим користувачем</span>
                        </div>

                        <div class="form-group">
                            <label for="customer-phone">Ваш телефон *</label>
                            <input type="text" id="customer-phone" placeholder="+38(___)___-__-__" required>
                        </div>

                        <div class="form-group">
                            <label for="customer-comment">Коментар до замовлення</label>
                            <textarea id="customer-comment" placeholder="Ваші побажання щодо замовлення"></textarea>
                        </div>
                    </div>

                    <div class="checkout-form-col">
                        <div class="form-section-title">Оплата та доставка</div>

                        <div class="form-group">
                            <label for="delivery-method">Спосіб доставки</label>
                            <select id="delivery-method">
                                <option value="">- Спосіб доставки -</option>
                                <option value="Нова Пошта">Нова Пошта</option>
                                <option value="Укрпошта">Укрпошта</option>
                                <option value="Самовивіз">Самовивіз</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="delivery-address">Адреса доставки</label>
                            <input type="text" id="delivery-address" placeholder="Місто, вулиця, номер відділення">
                        </div>

                        <div class="form-group">
                            <label for="postal-code">Поштовий індекс</label>
                            <input type="text" id="postal-code" placeholder="00000">
                        </div>

                        <div class="form-group">
                            <label for="payment-method">Спосіб оплати</label>
                            <select id="payment-method">
                                <option value="">- Спосіб оплати -</option>
                                <option value="Готівка">Готівка при отриманні</option>
                                <option value="Карта">Оплата на карту</option>
                                <option value="Безготівковий розрахунок">Безготівковий розрахунок</option>
                            </select>
                        </div>

                        <label class="form-checkbox">
                            <input type="checkbox" id="agree-privacy" required>
                            Погоджуюсь на обробку персональних даних
                        </label>
                    </div>

                </div>

                <button onclick="payAction()" class="submit-order-btn">Відправити замовлення</button>
                <a href="index.html" class="continue-shopping-btn">Продовжити покупки</a>
            </div>

            <button onclick="clearCart()" class="clear-cart-btn">Очистити кошик</button>
        </div>

    </main>

        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (productId && products[productId]) {
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty = (existing.qty || 1) + 1;
            } else {
                cart.push({
                    id: productId,
                    name: products[productId].name,
                    price: products[productId].price,
                    img: products[productId].img,
                    qty: 1
                });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        function renderCart() {
            const detailsContainer = document.getElementById('product-details');
            const totalContainer = document.getElementById('total-price');

            if (cart.length === 0) {
                detailsContainer.innerHTML = `<p style="color: gray; margin: 20px 0;">Кошик порожній.</p>`;
                totalContainer.innerHTML = `Загальна сума: 0 грн`;
                return;
            }

            let cartHTML = '';
            let totalSum = 0;

            cart.forEach((item, index) => {
                const qty = item.qty || 1;
                const lineTotal = item.price * qty;
                totalSum += lineTotal;

                const priceLine = qty > 1
                    ? `${item.price} грн x ${qty} шт. = ${lineTotal.toFixed(2)} грн`
                    : `${item.price} грн`;

                cartHTML += `
                    <div class="cart-item">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">${priceLine}</div>
                            <div class="cart-item-qty">
                                <button class="qty-btn" onclick="decreaseQty(${index})">−</button>
                                <span class="qty-value">${qty}</span>
                                <button class="qty-btn" onclick="increaseQty(${index})">+</button>
                            </div>
                        </div>
                        <button class="cart-item-remove" onclick="removeItem(${index})" title="Видалити">✕</button>
                    </div>
                `;
            });

            detailsContainer.innerHTML = cartHTML;
            totalContainer.innerHTML = `Загальна сума: ${totalSum.toFixed(2)} грн`;
        }

        function increaseQty(index) {
            cart[index].qty = (cart[index].qty || 1) + 1;
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function decreaseQty(index) {
            const currentQty = cart[index].qty || 1;
            if (currentQty <= 1) return;
            cart[index].qty = currentQty - 1;
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function clearCart() {
            if (confirm("Ви впевнені, що хочете очистити кошик?")) {
                localStorage.removeItem('cart');
                cart = [];
                renderCart();
            }
        }

        function payAction() {
            if (cart.length === 0) {
                alert("Ваш кошик порожній!");
                return;
            }

            const customerName = document.getElementById('customer-name').value.trim();
            const customerEmail = document.getElementById('customer-email').value.trim();
            const customerPhone = document.getElementById('customer-phone').value.trim();
            const customerComment = document.getElementById('customer-comment').value.trim();

            const deliveryMethod = document.getElementById('delivery-method').value;
            const deliveryAddress = document.getElementById('delivery-address').value.trim();
            const postalCode = document.getElementById('postal-code').value.trim();
            const paymentMethod = document.getElementById('payment-method').value;
            const agreePrivacy = document.getElementById('agree-privacy').checked;

            if (!customerName || !customerPhone) {
                alert("Будь ласка, заповніть ПІБ та телефон!");
                return;
            }
            if (!agreePrivacy) {
                alert("Потрібно погодитись на обробку персональних даних!");
                return;
            }

            let productsListText = "";
            let totalSum = 0;

            cart.forEach((item, index) => {
                const qty = item.qty || 1;
                const lineTotal = item.price * qty;
                productsListText += `${index + 1}. ${item.name} — ${item.price} грн x ${qty} шт. = ${lineTotal.toFixed(2)} грн\n`;
                totalSum += lineTotal;
            });

            const payBtn = document.querySelector('.submit-order-btn');
            payBtn.innerText = "Відправка...";
            payBtn.disabled = true;

            const templateParams = {
                customer_name: customerName,
                customer_email: customerEmail,
                customer_phone: customerPhone,
                customer_comment: customerComment,
                delivery_method: deliveryMethod,
                delivery_address: deliveryAddress,
                postal_code: postalCode,
                payment_method: paymentMethod,
                products_list: productsListText,
                total_price: totalSum.toFixed(2)
            };

            emailjs.send('service_rfvquv1', 'template_8qlmg9f', templateParams)
                .then(function(response) {
                    alert('Дякуємо! Ваше замовлення прийнято. Ми зв\'яжемося з вами найближчим часом.');
                    localStorage.removeItem('cart');
                    window.location.href = "index.html";
                }, function(error) {
                    alert('Помилка при відправці замовлення. Спробуйте ще раз.');
                    console.log('Помилка:', error);
                    payBtn.innerText = "Відправити замовлення";
                    payBtn.disabled = false;
                });
        }

        renderCart();
    </script>
