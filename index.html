<!--
    ВАЖЛИВО: перед цим скриптом обов'язково підключіть файл зі списком товарів:
    <script src="js/products.js"></script>
    (там має бути const products = {...} — той самий, що й у файлі оформлення замовлення)
-->
<script>
    const tireSearchInput = document.getElementById('tireSearch');
    const searchResultsBox = document.getElementById('searchResults');
    const categoriesBox = document.getElementById('categoriesGoods');
 
    // ЗАМІНІТЬ на реальну назву вашої сторінки оформлення замовлення
    const CHECKOUT_PAGE = "oformlennya.html";
 
    tireSearchInput.addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();
 
        if (query === '') {
            searchResultsBox.classList.remove('active');
            searchResultsBox.innerHTML = '';
            categoriesBox.style.display = '';
            return;
        }
 
        const matches = Object.entries(products).filter(([id, p]) =>
            p.name.toLowerCase().includes(query)
        );
 
        categoriesBox.style.display = 'none';
        searchResultsBox.classList.add('active');
 
        if (matches.length === 0) {
            searchResultsBox.innerHTML = `<div class="no-results">Нічого не знайдено за запитом «${this.value}»</div>`;
            return;
        }
 
        searchResultsBox.innerHTML = matches.map(([id, p]) => `
            <div class="search-result-card">
                <img src="${p.img}" alt="${p.name}">
                <div class="search-result-name">${p.name}</div>
                <div class="search-result-price">${p.price} грн</div>
                <a href="buymore.html?id=${id}" class="search-result-buy">Купити</a>
            </div>
        `).join('');
    });
</script>
